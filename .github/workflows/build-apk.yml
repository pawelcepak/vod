name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
      - "test/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          VOD_KEYSTORE_BASE64: ${{ secrets.VOD_KEYSTORE_BASE64 }}
          VOD_KEYSTORE_PASSWORD: ${{ secrets.VOD_KEYSTORE_PASSWORD }}
          VOD_KEY_ALIAS: ${{ secrets.VOD_KEY_ALIAS }}
          VOD_KEY_PASSWORD: ${{ secrets.VOD_KEY_PASSWORD }}
        run: |
          test -n "$VOD_KEYSTORE_BASE64" || (echo "Missing VOD_KEYSTORE_BASE64" && exit 1)
          test -n "$VOD_KEYSTORE_PASSWORD" || (echo "Missing VOD_KEYSTORE_PASSWORD" && exit 1)
          test -n "$VOD_KEY_ALIAS" || (echo "Missing VOD_KEY_ALIAS" && exit 1)
          test -n "$VOD_KEY_PASSWORD" || (echo "Missing VOD_KEY_PASSWORD" && exit 1)

      - name: Restore release keystore
        env:
          VOD_KEYSTORE_BASE64: ${{ secrets.VOD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/vod-signing"
          printf '%s' "$VOD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vod-signing/vod-release.jks"

      - name: Build signed release APK
        env:
          VOD_KEYSTORE_PATH: ${{ runner.temp }}/vod-signing/vod-release.jks
          VOD_KEYSTORE_PASSWORD: ${{ secrets.VOD_KEYSTORE_PASSWORD }}
          VOD_KEY_ALIAS: ${{ secrets.VOD_KEY_ALIAS }}
          VOD_KEY_PASSWORD: ${{ secrets.VOD_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/VOD-USB.apk
          cp app/build/outputs/apk/release/app-release.apk output/VOD-USB-build-${{ github.run_number }}.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOD-USB-APK-${{ github.run_number }}
          path: output/*.apk
          if-no-files-found: error

      - name: Publish stable APK link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest output/VOD-USB.apk --clobber
          else
            gh release create latest output/VOD-USB.apk \
              --title "VOD USB — najnowsza wersja" \
              --notes "Stały punkt pobierania aktualnej wersji aplikacji VOD USB."
          fi
