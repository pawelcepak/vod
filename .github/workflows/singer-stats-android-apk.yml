name: Singer Stats Android APK
on:
  workflow_dispatch:
  push:
    branches: [singer-stats-android-build]
    paths:
      - 'singer-stats-android/**'
      - '.github/workflows/singer-stats-android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: singer-stats-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SingerStatsVisualizer-APK
          path: singer-stats-android/app/build/outputs/apk/debug/app-debug.apk
